      <rect x="20" y="0" width="1" height="16" fill="#e2be98"/>
      <rect x="6" y="16" width="1" height="16" fill="#e2be98"/>
    </pattern>

    <!-- Focus Room: Calm Pale Gray-Blue (#EBF0F5) -->
