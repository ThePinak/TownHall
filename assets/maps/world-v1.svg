    <!-- Town Hall: Warm Birch Wood Planks (#D7C4A5) -->
    <pattern id="floorTownHall" width="32" height="32" patternUnits="userSpaceOnUse">
      <rect width="32" height="32" fill="#d7c4a5"/>
      <rect x="0" y="15" width="32" height="1" fill="#c2ab88"/>
      <rect x="0" y="31" width="32" height="1" fill="#c2ab88"/>
      <rect x="16" y="0" width="1" height="16" fill="#c2ab88"/>
      <rect x="8" y="16" width="1" height="16" fill="#c2ab88"/>
    </pattern>

    <!-- Coding Room: Slate Blue Tiles (#334155) -->
